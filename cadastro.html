<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - LZN Barber Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>LZN Barber Shop</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="horarios.html">Horários</a>
        <a href="servicos.html">Serviços</a>
        <a href="sobre.html">Sobre Nós</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>
<main>
    <h2>Cadastro</h2>
    <form action="horarios.html" method="get">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
        >

        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >

        <label for="telefone">Telefone:</label>
        <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(31) 99999-9999"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            required
        >
        <small>Formato: (99) 99999-9999</small>
        <button type="submit">
            Continuar para horários
        </button>
    </form>
</main>
<footer>
    <p> © 2026 LZN Barber Shop</p>
</footer>
</body>
</html>
